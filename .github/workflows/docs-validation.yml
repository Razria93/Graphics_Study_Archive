name: Docs Validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate GitHub bodies
        shell: pwsh
        run: ./Docs/98_Tools/validators/validate-github-body.ps1

      - name: Validate GitHub quality
        shell: pwsh
        run: ./Docs/98_Tools/validators/validate-github-quality.ps1

      - name: Test GitHub visual validator fixtures
        shell: pwsh
        run: ./Docs/98_Tools/validators/test-github-visual-quality.ps1

      - name: Validate Demo indexes
        shell: pwsh
        run: ./Docs/98_Tools/validators/validate-demo-index-quality.ps1

      - name: Test Demo index validator fixtures
        shell: pwsh
        run: ./Docs/98_Tools/validators/test-demo-index-quality.ps1

      - name: Validate Demo documents
        shell: pwsh
        run: ./Docs/98_Tools/validators/validate-demo-doc-quality.ps1

      - name: Test Demo document validator fixtures
        shell: pwsh
        run: ./Docs/98_Tools/validators/test-demo-doc-quality.ps1

      - name: Validate tracked video assets
        shell: pwsh
        run: ./Docs/98_Tools/validators/validate-video-asset-quality.ps1

      - name: Test video asset validator fixtures
        shell: pwsh
        run: ./Docs/98_Tools/validators/test-video-asset-quality.ps1

      - name: Test window capture tool contracts
        shell: pwsh
        run: ./Docs/98_Tools/validators/test-window-capture-tools.ps1

      - name: Test window input primitive contracts
        shell: pwsh
        run: ./Docs/98_Tools/validators/test-window-input-primitives.ps1

      - name: Validate Topic documents
        shell: pwsh
        run: ./Docs/98_Tools/validators/validate-topic-doc-quality.ps1

      - name: Test Markdown wrap validator fixtures
        shell: pwsh
        run: ./Docs/98_Tools/validators/test-markdown-wrap-quality.ps1

      - name: Validate Markdown wrapping
        shell: pwsh
        run: ./Docs/98_Tools/validators/validate-markdown-wrap-quality.ps1

      - name: Test Markdown render validator fixtures
        shell: pwsh
        run: ./Docs/98_Tools/validators/test-markdown-render-quality.ps1

      - name: Validate Markdown rendering
        shell: pwsh
        run: ./Docs/98_Tools/validators/validate-markdown-render-quality.ps1

      - name: Test Markdown table validator fixtures
        shell: pwsh
        run: ./Docs/98_Tools/validators/test-markdown-table-quality.ps1

      - name: Validate Markdown tables
        shell: pwsh
        run: ./Docs/98_Tools/validators/validate-markdown-table-quality.ps1
